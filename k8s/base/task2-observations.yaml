apiVersion: apps/v1
kind: Deployment
metadata:
  name: task2-observations-service
  namespace: cosmorum
spec:
  replicas: 1
  selector:
    matchLabels: { app: task2-observations-service }
  template:
    metadata:
      labels: { app: task2-observations-service }
    spec:
      containers:
        - name: app
          image: REPLACE_WITH_GAR_IMAGE_TASK2
          ports:
            - containerPort: 8080
          env:
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: cosmorum-secrets, key: JWT_SECRET } }
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/$(POSTGRES_DB)"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: cosmorum-secrets, key: POSTGRES_USER } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: cosmorum-secrets, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: cosmorum-secrets, key: POSTGRES_DB } }
---
apiVersion: v1
kind: Service
metadata:
  name: task2-observations-service
  namespace: cosmorum
spec:
  selector: { app: task2-observations-service }
  ports:
    - port: 8080
      targetPort: 8080
